<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mustwatch69</title>
  <meta name="description" content="A browsable archive of saved posts." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container bar">
      <div class="brand"><span class="dot"></span> mustwatch69</div>
      <nav class="header-links">
        <span id="online-badge" class="online-badge"></span>
        <a href="index.html">Home</a>
        <a href="add-post.html" class="nav-add-post" style="display:none">Add Post</a>
        <button type="button" class="nav-access-btn">Access</button>
        <button type="button" class="nav-logout-btn" style="display:none">Log out</button>
      </nav>
    </div>
    <div class="scrolled-header-content" id="scrolled-header-content" style="display:none;">
       <!-- Search wrap will be moved here on scroll -->
       <div id="scrolled-updates-text" class="scrolled-updates-text"></div>
    </div>
  </header>

  <main class="container">
    <section class="hero" id="main-hero-section">
      <div class="header-search-row" id="hero-search-placeholder" style="padding-bottom: 24px; padding-top: 0;">
        <div class="search-wrap" id="the-search-wrap">
          <span class="search-icon">⌕</span>
          <input id="search-input" class="search-input" type="text" placeholder="Enter a post number to jump, or type to search…" autocomplete="off" />
          <div class="search-results" id="search-results"></div>
        </div>
      </div>
      <div class="channel-id">
        <div class="channel-avatar"><img src="assets/img/profile.jpg" alt="mustwatch69" /></div>
        <div>
          <h1>mustwatch69</h1>
          <p>Adult premium collection · chronological feed</p>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-pill">Posts: <strong id="stat-total">…</strong></div>
        <div class="stat-pill">Range: <strong id="stat-range">…</strong></div>
        <div class="stat-pill">Missing: <strong id="stat-missing">…</strong></div>
        <div class="stat-pill">Visits: <strong id="stat-visits-today">…</strong></div>
      </div>

      <div class="recent-updates-banner" id="recent-updates-banner" style="display:none;">
        <div class="banner-header">
          <span class="pulse-dot"></span>
          <div class="updates-text" id="recent-updates-text">Loading updates...</div>
        </div>
        <div class="latest-posts-scroller" id="latest-posts-scroller"></div>
      </div>

      <div class="section-toggle" id="section-toggle">
        <button class="toggle-btn active" data-section="numbered" type="button">Numbered Archive</button>
        <button class="toggle-btn" data-section="unnumbered" type="button">Unnumbered Posts</button>
      </div>

      <div class="search-meta" id="search-meta">Type a post number (e.g. 392) to jump straight to it, or type text to see matching posts.</div>
    </section>

    <section class="feed" id="feed"></section>
    <div class="loader-row" id="loader-row">Loading more…</div>
  </main>

  <footer class="site-footer">mustwatch69 · premium archive</footer>

  <div class="scroll-indicator" id="scroll-indicator"></div>

  <div class="fast-scroller" id="fast-scroller">
    <div class="fast-scroller-track" id="fast-scroller-track">
      <div class="fast-scroller-thumb" id="fast-scroller-thumb"></div>
    </div>
    <div class="fast-scroller-tooltip" id="fast-scroller-tooltip"></div>
  </div>

  <button type="button" class="jump-toggle-btn" id="jump-toggle-btn" title="Jump to last post" aria-label="Jump to last post">⌄ End Post</button>

  <script src="assets/js/data.js?v=4"></script>
  <script src="assets/js/auth.js?v=4"></script>
  <script src="assets/js/presence.js?v=4"></script>
  <script src="assets/js/visits.js?v=4"></script>
  <script src="assets/js/home.js?v=4"></script>
  
  <script>
    // Robust sticky search and updates text logic
    const searchWrap = document.getElementById("the-search-wrap");
    const searchPlaceholder = document.getElementById("hero-search-placeholder");
    const scrolledHeader = document.getElementById("scrolled-header-content");
    const scrolledUpdatesText = document.getElementById("scrolled-updates-text");
    const mainUpdatesText = document.getElementById("recent-updates-text");

    if (searchWrap && searchPlaceholder && scrolledHeader) {
      searchPlaceholder.style.minHeight = "48px"; 

      window.addEventListener("scroll", () => {
        // Use raw scrollY for absolute reliability instead of getBoundingClientRect
        if (window.scrollY > 120) {
          if (scrolledHeader.style.display !== "flex") {
            scrolledHeader.style.display = "flex";
            scrolledHeader.insertBefore(searchWrap, scrolledUpdatesText);
            if (mainUpdatesText) {
              scrolledUpdatesText.innerHTML = mainUpdatesText.innerHTML;
            }
          }
        } else {
          if (scrolledHeader.style.display !== "none") {
            scrolledHeader.style.display = "none";
            searchPlaceholder.appendChild(searchWrap);
          }
        }
      }, { passive: true });
    }
  </script>
</body>
</html>
